spring.application.name=vivaeventos-analytics
app.version=0.1.0
app.api.version=v1

server.port=8099

spring.datasource.url=jdbc:postgresql://localhost:5433/vivaeventos_analytics
spring.datasource.username=devdb
spring.datasource.password=a1b2c3d4

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

management.server.port=8100
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=*

logging.level.root=ERROR
logging.level.web=INFO

spring.jackson.serialization.indent-output=true

# ── Trazabilidad distribuida (Micrometer Tracing + Zipkin) ──────
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
